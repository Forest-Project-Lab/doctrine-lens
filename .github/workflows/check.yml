# 統治と実装の門。手元の `npm run check` と同じものを回し、
# 編集器の中でしか確かめられない部分も実際の VS Code で回す。
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 既定は深さ 1。それだと `docs:measured` が刻印の commit を展開できず、
          # 「刻印を添えよ」と言う門が刻印を読めないまま落ちる（CHANGE-024）。
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 統治層の正本は上流にある。同梱せず、ここで取る。
      #
      # 置き場所は、拡張機能自身が探す場所（<CLAUDE_CONFIG_DIR>/plugins/cache/
      # <marketplace>/<plugin>/<version>/）に合わせる。合わせないと、統治木の監査だけは
      # 通り、拡張機能ホストの試験だけが「プラグインが見つからない」で必ず落ちる
      # （実際にそうなっていて、公開した main が最初から赤かった）。
      # tools/doctrine-path.mjs も同じ規則で引くので、道具と実装が一本化される。
      # 取りに行くのは **固定した commit** である（research/system-map/doctrine.pin.json）。
      # 以前は `main` を浅く複製しており、その日の main が何であれ黙って測っていた。
      # tag は動かせるが commit は動かせないので、commit で取って照合する。
      - name: doctrine プラグインを固定した commit で取る
        run: |
          set -euo pipefail
          pin=research/system-map/doctrine.pin.json
          commit=$(python3 -c "import json;print(json.load(open('$pin'))['commit'])")
          want=$(python3 -c "import json;print(json.load(open('$pin'))['version'])")
          git init -q "$RUNNER_TEMP/doctrine"
          git -C "$RUNNER_TEMP/doctrine" remote add origin https://github.com/Forest-Project-Lab/doctrine.git
          git -C "$RUNNER_TEMP/doctrine" fetch -q --depth 1 origin "$commit"
          git -C "$RUNNER_TEMP/doctrine" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/doctrine" rev-parse HEAD)" = "$commit"
          version=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['version'])" \
            "$RUNNER_TEMP/doctrine/plugin/.claude-plugin/plugin.json")
          test "$version" = "$want"
          dest="$RUNNER_TEMP/claude/plugins/cache/forest-project-lab/doctrine/$version"
          mkdir -p "$(dirname "$dest")"
          mv "$RUNNER_TEMP/doctrine/plugin" "$dest"
          test -f "$dest/scripts/docs-audit.py"
          echo "CLAUDE_CONFIG_DIR=$RUNNER_TEMP/claude" >> "$GITHUB_ENV"
          echo "固定した実体を置いた: 版 $version / commit ${commit:0:7}"

      - run: npm ci

      # 置き場所が合っているかを、走らせる前に一度で確かめる。合っていないと、
      # 以降の失敗が「拡張機能ホストの試験が 90 秒沈黙して落ちる」としてしか現れない。
      # 「ファイルが在る」では足りない。**固定した版を引いたか**まで確かめる。
      # --require-pin は食い違いで終了コード 3 を返す（静かに測らない）。
      - name: プラグインの解決が固定と合うことを確かめる
        run: |
          set -euo pipefail
          resolved=$(node tools/doctrine-path.mjs --require-pin)
          test -f "$resolved/scripts/docs-audit.py"
          node tools/doctrine-path.mjs --json --require-pin > /dev/null

      - name: 型検査
        run: npm run typecheck

      - name: 試験
        run: npm test

      - name: 束ね
        run: npm run compile

      - name: 統治木の全件監査
        run: npm run docs:check   # 手元と同じ命令。プラグインの引き方も一つにする

      # 文書一件ごとの規則（禁止同義語・必須節・許可 status）。監査は文書の
      # 間の関係を見るが、一件の中は見ない。上流に在ったこの門を、私は
      # どこにも結んでいなかった（CHANGE-023）。
      - name: 統治木の全件点検
        run: npm run docs:lint

      # 統治木の外に在る根の文書（README・AGENTS・CLAUDE・DESIGN・CHANGELOG）。
      # `docs:lint` は木の中しか走らないので、ここが無いと辞書が一度も当たらない。
      # 上流は自分の CI に同じ段を持っていた。こちらには無かった（CHANGE-025）。
      - name: 根の文書の用語
        run: npm run docs:terms

      # 文書が挙げる実測を、その場で測り直して突き合わせる（3 秒）。
      # 手元で `npm run check` の出力を絞って読んでいたせいで、この段が
      # 赤いまま「全門が緑」と報告し続けたことがある（CHANGE-019）。
      - name: 文書の実測
        run: npm run docs:measured

      # 拡張機能ホストは Electron なので、X サーバが要る。
      - name: 拡張機能ホストの試験
        run: xvfb-run -a npm run test:integration

      # 実物の画面を撮って読む（11 秒）。TEST-006 が受入 10・11・34 の
      # 受け持ちを「画面側（npm run preview）」と宣言しているので、
      # **宣言した受け持ちを機械の経路に置く**（CHANGE-019）。
      - name: 実物の画面
        run: npx playwright install --with-deps chromium && npm run preview

      - name: 配布物を組む
        run: npm run package   # devDependencies に固定した vsce を使う（手元と同じ道具）

      - uses: actions/upload-artifact@v4
        with:
          name: doctrine-lens-vsix
          path: doctrine-lens.vsix
